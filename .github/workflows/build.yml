name: Build site

# Rebuilds dist/ and commits it, so Cloudflare Pages can deploy the site even
# when no build command is set in the dashboard.
on:
  push:
    branches: [main]
    paths-ignore:
      - dist/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node build.mjs
      - name: Commit dist
        run: |
          git add -A dist
          if git diff --cached --quiet; then
            echo "dist is up to date."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898499+github-actions[bot]@users.noreply.github.com"
            git commit -m "Build site"
            git push
          fi
