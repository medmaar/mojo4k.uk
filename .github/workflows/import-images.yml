name: Import images from WordPress

# Copies the site's images from the old WordPress media library into the repo.
# Runs on demand (Actions tab → Run workflow) and whenever scripts/images.txt changes.
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/images.txt
      - scripts/import-images.mjs

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/import-images.mjs
      - name: Commit new images
        run: |
          git add public/images
          if git diff --cached --quiet; then
            echo "No new images."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898499+github-actions[bot]@users.noreply.github.com"
            git commit -m "Import images from WordPress"
            git push
          fi
